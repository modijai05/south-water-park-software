version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: south-water-park-db
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: south_water_park
    volumes:
      - mongodb_data:/data/db
      - ./data:/docker-entrypoint-initdb.d
    networks:
      - south-water-park-network

  # Backend API Server
  backend:
    build:
      context: ./backend/server
      dockerfile: Dockerfile
    container_name: south-water-park-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      NODE_ENV: production
      PORT: 8000
      MONGODB_URI: mongodb://admin:password@mongodb:27017/south_water_park?authSource=admin
      JWT_SECRET: your-super-secret-jwt-key-change-this-in-production
    depends_on:
      - mongodb
    volumes:
      - ./backend/server:/app
      - /app/node_modules
    networks:
      - south-water-park-network

  # Frontend Application
  frontend:
    build:
      context: ./frontend/client
      dockerfile: Dockerfile
    container_name: south-water-park-frontend
    restart: unless-stopped
    ports:
      - "5174:5174"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend/client:/app
      - /app/node_modules
    networks:
      - south-water-park-network

volumes:
  mongodb_data:

networks:
  south-water-park-network:
    driver: bridge
