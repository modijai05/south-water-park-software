<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Config Initialization</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; border-radius: 5px; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        .info { background-color: #d1ecf1; border-color: #bee5eb; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 3px; overflow-x: auto; }
        .login-form { max-width: 300px; }
        .login-form input { width: 100%; padding: 8px; margin: 5px 0; }
    </style>
</head>
<body>
    <h1>🎫 Ticket Config Initialization Test</h1>
    
    <div class="test-section info">
        <h2>🔐 Login Required</h2>
        <p>You need to login first to test the ticket config API.</p>
        <div class="login-form">
            <input type="text" id="username" placeholder="Username" value="admin1">
            <input type="password" id="password" placeholder="Password" value="admin1">
            <button onclick="login()">🔑 Login</button>
        </div>
        <div id="loginResult"></div>
    </div>

    <div class="test-section">
        <h2>🧪 Test Controls</h2>
        <button onclick="testGetConfigs()">📋 Get Current Configs</button>
        <button onclick="testInitializeConfigs()">🚀 Initialize Default Configs</button>
        <button onclick="testUpdateConfig()">✏️ Update Config (300)</button>
        <button onclick="clearLogs()">🗑️ Clear Logs</button>
    </div>

    <div class="test-section">
        <h2>📊 Test Log</h2>
        <div id="testLog"></div>
    </div>

    <script>
        let authToken = localStorage.getItem('token') || '';
        
        function log(message, type = 'info') {
            const logDiv = document.getElementById('testLog');
            const timestamp = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = type;
            entry.innerHTML = `<strong>[${timestamp}]</strong> ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('loginResult');
            
            try {
                log('🔑 Attempting login...');
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    authToken = data.token;
                    localStorage.setItem('token', authToken);
                    resultDiv.innerHTML = `<div class="success">✅ Login successful! Token: ${authToken.substring(0, 20)}...</div>`;
                    log('✅ Login successful!');
                } else {
                    resultDiv.innerHTML = `<div class="error">❌ Login failed: ${data.message}</div>`;
                    log(`❌ Login failed: ${data.message}`, 'error');
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">❌ Network error: ${error.message}</div>`;
                log(`❌ Network error: ${error.message}`, 'error');
            }
        }

        async function testGetConfigs() {
            if (!authToken) {
                log('❌ Please login first!', 'error');
                return;
            }
            
            try {
                log('📋 Fetching current ticket configs...');
                const response = await fetch('/api/ticket-config', {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    log(`✅ Found ${data.length} ticket configs:`, 'success');
                    data.forEach(config => {
                        log(`  - ${config.ticketType}: ₹${config.basePrice} (${config.label}) - Kids: ${config.hasKids ? 'Yes' : 'No'}`);
                    });
                } else {
                    log(`❌ Failed to get configs: ${data.message}`, 'error');
                }
            } catch (error) {
                log(`❌ Network error: ${error.message}`, 'error');
            }
        }

        async function testInitializeConfigs() {
            if (!authToken) {
                log('❌ Please login first!', 'error');
                return;
            }
            
            try {
                log('🚀 Initializing default ticket configs...');
                const response = await fetch('/api/ticket-config/initialize', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    log('✅ Default configs initialized successfully!', 'success');
                    // Test getting configs after initialization
                    setTimeout(testGetConfigs, 500);
                } else {
                    log(`❌ Failed to initialize: ${data.message}`, 'error');
                }
            } catch (error) {
                log(`❌ Network error: ${error.message}`, 'error');
            }
        }

        async function testUpdateConfig() {
            if (!authToken) {
                log('❌ Please login first!', 'error');
                return;
            }
            
            try {
                log('✏️ Updating 300 ticket config...');
                const response = await fetch('/api/ticket-config/300', {
                    method: 'PUT',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify({
                        basePrice: 350,
                        label: '₹350 – Updated 3-4hr access',
                        hasKids: true,
                        description: 'Updated full access to water activities for 3-4 hours',
                        isActive: true
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    log('✅ Config updated successfully!', 'success');
                    log(`  Updated price: ₹${data.basePrice}, Label: ${data.label}`);
                    // Test getting configs after update
                    setTimeout(testGetConfigs, 500);
                } else {
                    log(`❌ Failed to update: ${data.message}`, 'error');
                }
            } catch (error) {
                log(`❌ Network error: ${error.message}`, 'error');
            }
        }

        function clearLogs() {
            document.getElementById('testLog').innerHTML = '';
            document.getElementById('loginResult').innerHTML = '';
            log('🗑️ Logs cleared');
        }

        // Check if already logged in
        if (authToken) {
            log('🔐 Found existing token, testing connection...');
            testGetConfigs();
        } else {
            log('👋 Please login to test the ticket config API');
        }
    </script>
</body>
</html>
