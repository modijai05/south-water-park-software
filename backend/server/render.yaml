services:
  - type: web
    name: south-water-park-backend
    env: node
    plan: free
    buildCommand: "npm run build"
    startCommand: "npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: PORT
        value: 10000
    healthCheckPath: /api/health
    autoDeploy: true
    buildFilter:
      paths:
        - src/**
        - package.json
        - tsconfig.json
    domains:
      - south-water-park-api.onrender.com
      - south-water-park-backend.onrender.com
