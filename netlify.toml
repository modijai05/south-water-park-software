[build]
  command = "npm run build"
  publish = "frontend/client/dist"

[build.environment]
  NODE_VERSION = "18"
  NPM_FLAGS = "--no-workspaces"

# Force redeploy - workspace fix applied - FIXED DEPLOYMENT PATH

[[redirects]]
  from = "/api/*"
  to = "https://south-water-park-backend.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
