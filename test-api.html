<!DOCTYPE html>
<html>
<head>
    <title>Test Stats API</title>
</head>
<body>
    <h1>Testing Stats API</h1>
    <button onclick="testStats()">Test Stats</button>
    <div id="result"></div>

    <script>
        async function testStats() {
            try {
                // First login to get token
                const loginResponse = await fetch('http://localhost:5000/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: 'admin1',
                        password: 'admin1'
                    })
                });
                
                const loginData = await loginResponse.json();
                console.log('Login response:', loginData);
                
                if (loginData.token) {
                    // Now test stats with token
                    const statsResponse = await fetch('http://localhost:5000/api/entries/stats', {
                        headers: {
                            'Authorization': `Bearer ${loginData.token}`,
                            'Content-Type': 'application/json'
                        }
                    });
                    
                    const statsData = await statsResponse.json();
                    console.log('Stats response:', statsData);
                    
                    document.getElementById('result').innerHTML = `
                        <h2>Stats Results:</h2>
                        <pre>${JSON.stringify(statsData, null, 2)}</pre>
                        
                        <h3>Key Metrics to Check:</h3>
                        <p><strong>Today's 300 tickets:</strong> ${statsData.today300 || 0} (should include main + upgrades)</p>
                        <p><strong>Total 300 tickets:</strong> ${statsData.total300 || 0} (should include main + upgrades)</p>
                        <p><strong>Today's 300 adults:</strong> ${statsData.today300Adults || 0}</p>
                        <p><strong>Today's 300 kids:</strong> ${statsData.today300Kids || 0}</p>
                        <p><strong>Today's 450 tickets:</strong> ${statsData.today450 || 0}</p>
                        <p><strong>Total 450 tickets:</strong> ${statsData.total450 || 0}</p>
                        <p><strong>Today's 600 tickets:</strong> ${statsData.today600 || 0}</p>
                        <p><strong>Total 600 tickets:</strong> ${statsData.total600 || 0}</p>
                        <p><strong>Today's 100 tickets:</strong> ${statsData.today100 || 0}</p>
                        <p><strong>Total 100 tickets:</strong> ${statsData.total100 || 0}</p>
                    `;
                } else {
                    document.getElementById('result').innerHTML = `<p>Login failed: ${JSON.stringify(loginData)}</p>`;
                }
            } catch (error) {
                console.error('Test failed:', error);
                document.getElementById('result').innerHTML = `<p>Error: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
