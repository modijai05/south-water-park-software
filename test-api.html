<!DOCTYPE html>
<html>
<head>
    <title>API Test</title>
</head>
<body>
    <h1>Testing Production API</h1>
    <button onclick="testLogin()">Login</button>
    <button onclick="testEntries()">Get Entries</button>
    <div id="result"></div>

    <script>
        let token = '';
        
        async function testLogin() {
            try {
                const response = await fetch('https://south-water-park-backend.onrender.com/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: 'admin1', password: 'admin1' })
                });
                const data = await response.json();
                token = data.token;
                document.getElementById('result').innerHTML = `<pre>Login Success: ${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                document.getElementById('result').innerHTML = `Login Error: ${error.message}`;
            }
        }
        
        async function testEntries() {
            try {
                const response = await fetch('https://south-water-park-backend.onrender.com/api/entries', {
                    headers: { 
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                const data = await response.json();
                document.getElementById('result').innerHTML = `<pre>Entries (${data.data?.entries?.length || 0} found): ${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                document.getElementById('result').innerHTML = `Entries Error: ${error.message}`;
            }
        }
    </script>
</body>
</html>
